<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
  aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content bg-success-subtle">
      <div class="modal-header bg-success text-white">
        <h1 class="modal-title fs-5" id="staticBackdropLabel">Sucesso!</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Dados de perfil atualizados com sucesso!
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" (click)="onReturn()">OK</button>
      </div>
    </div>
  </div>
</div>

<div class="d-flex justify-content-center align-items-center">
  <div class="mb-1 w-50">
    <h2>Meu perfil</h2>
    <p>Gerencie suas informações pessoas e configurações de conta.</p>
  </div>
</div>
<div class="d-flex justify-content-center align-items-center">
  <form class="bg-white rounded-4 shadow p-4 w-50" [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <h4>
      <i class="bi bi-person-circle"></i>
      Foto de perfil</h4>
    <p>Aceitamos PNGs, JPGs e JPEGs abaixo de 2MB.</p>

    <hr>

    <div class="mb-3">
      <label class="form-label">Nome Completo</label>
      <input type="text" class="form-control" id="nome" formControlName="nome" maxlength="255">
    </div>

    <div class="mb-3">
      <label class="form-label">Email Institucional</label>
      <input type="text" class="form-control" id="email" formControlName="email" maxlength="255">
    </div>

    <div class="mb-3">
      <label class="form-label">Tipo de Perfil</label><br/>
      <span class="badge bg-warning mb-3 text-dark">{{ tipoPerfil | uppercase }}</span>
    </div>

    <p>
      <a routerLink="/alterar-senha" class="link-primary text-decoration-none">
        <i class="bi bi-key"></i> Alterar senha de acesso
      </a>
    </p>

    <hr>

    <button type="button" class="btn btn-secondary" (click)="onReturn()">Cancelar</button>
    <button type="submit" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop" [disabled]="userForm.invalid">Salvar alterações</button>
  </form>
</div>
